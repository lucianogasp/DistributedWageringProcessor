services:
  database:
    image: postgres:16-alpine
    container_name: wagering-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: wagering
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: